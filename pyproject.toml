[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-lab"
version = "0.1.0"
description = "Automated IQ/WAV Signal Analysis Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Signal Lab Team" }]
dependencies = [
    "pyside6>=6.7.0",
    "pyqtgraph>=0.13.7",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.13.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.4.0",
]
ml = [
    "torch>=2.2.0",
    "onnxruntime>=1.17.0",
]

[project.scripts]
signal-lab = "signal_lab.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["signal_lab*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
qt_api = "pyside6"
